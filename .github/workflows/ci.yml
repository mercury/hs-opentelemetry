name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (x86_64-linux)
    runs-on: namespace-profile-mercury-oss-linux
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # nix-eval-jobs fetches the repo as a git+file flake input and
          # cannot compute a stable narHash from a shallow clone.
          fetch-depth: 0

      # Mounts /nix from the Namespace cache volume; must run before Nix is
      # installed so the store lands on the volume.
      - name: Set up nix cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: nix

      - name: Install Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://cache.iog.io https://devenv.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
            # Fail loudly on hung builds instead of eating the whole job
            # timeout: kill any derivation silent for 30 minutes and name it.
            max-silent-time = 1800

      # Resolve the flake to a store path once; nix-eval-jobs (inside
      # nix-fast-build) bundles its own nix and disagrees with the
      # installed nix about git+file narHashes, so evaluate from the
      # store copy where git is out of the picture.
      - name: Resolve flake to a store path
        run: |
          nix flake metadata --json > /tmp/flake-meta.json
          FLAKE_PATH=$(grep -oE '"path":"/nix/store/[^"]+"' /tmp/flake-meta.json | head -1 | cut -d'"' -f4)
          test -n "$FLAKE_PATH"
          echo "FLAKE_PATH=$FLAKE_PATH" >> "$GITHUB_ENV"

      # Builds intermittently wedge in fixupPhase on the runner (likely a
      # cache-volume I/O stall); max-silent-time bounds each wedge at 30
      # minutes and a retry redoes only the killed derivation, since
      # everything else is already in the local store.
      - name: Prepare build helper
        run: |
          cat > /tmp/nfb.sh <<'EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          for attempt in 1 2 3; do
            nix run 'github:Mic92/nix-fast-build/807539facae08bede14d1ad258b4003721252e79' -- --no-nom --skip-cached --flake "$1" && exit 0
            echo "::warning::nix-fast-build attempt $attempt for $1 failed; retrying"
          done
          exit 1
          EOF
          chmod +x /tmp/nfb.sh

      # The same targets garnix.yaml built: the per-GHC test suites and the
      # flake checks. nix-fast-build writes per-target results to the
      # GitHub step summary.
      - name: Build ghc94 suite
        run: /tmp/nfb.sh "$FLAKE_PATH#packages.x86_64-linux.hs-opentelemetry-suite-ghc94"

      - name: Build ghc96 suite
        if: ${{ !cancelled() }}
        run: /tmp/nfb.sh "$FLAKE_PATH#packages.x86_64-linux.hs-opentelemetry-suite-ghc96"

      - name: Build ghc98 suite
        if: ${{ !cancelled() }}
        run: /tmp/nfb.sh "$FLAKE_PATH#packages.x86_64-linux.hs-opentelemetry-suite-ghc98"

      - name: Build ghc910 suite
        if: ${{ !cancelled() }}
        run: /tmp/nfb.sh "$FLAKE_PATH#packages.x86_64-linux.hs-opentelemetry-suite-ghc910"

      - name: Run flake checks
        if: ${{ !cancelled() }}
        run: /tmp/nfb.sh "$FLAKE_PATH#checks.x86_64-linux.pre-commit-check"
