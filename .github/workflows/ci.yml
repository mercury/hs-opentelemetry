name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (x86_64-linux)
    runs-on: namespace-profile-mercury-oss-linux
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Mounts /nix from the Namespace cache volume; must run before Nix is
      # installed so the store lands on the volume.
      - name: Set up nix cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: nix

      - name: Install Nix
        uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://cache.iog.io https://devenv.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
            # Fail loudly on hung builds instead of eating the whole job
            # timeout: kill any derivation silent for an hour and name it.
            max-silent-time = 3600

      # The same targets garnix.yaml built: the per-GHC test suites and the
      # flake checks. nix-fast-build writes per-target results to the
      # GitHub step summary and retries transient failures.
      - name: Build ghc94 suite
        run: nix run 'github:Mic92/nix-fast-build/807539facae08bede14d1ad258b4003721252e79' -- --no-nom --skip-cached --retries 2 --flake '.#hs-opentelemetry-suite-ghc94'

      - name: Build ghc96 suite
        if: ${{ !cancelled() }}
        run: nix run 'github:Mic92/nix-fast-build/807539facae08bede14d1ad258b4003721252e79' -- --no-nom --skip-cached --retries 2 --flake '.#hs-opentelemetry-suite-ghc96'

      - name: Build ghc98 suite
        if: ${{ !cancelled() }}
        run: nix run 'github:Mic92/nix-fast-build/807539facae08bede14d1ad258b4003721252e79' -- --no-nom --skip-cached --retries 2 --flake '.#hs-opentelemetry-suite-ghc98'

      - name: Build ghc910 suite
        if: ${{ !cancelled() }}
        run: nix run 'github:Mic92/nix-fast-build/807539facae08bede14d1ad258b4003721252e79' -- --no-nom --skip-cached --retries 2 --flake '.#hs-opentelemetry-suite-ghc910'

      - name: Run flake checks
        if: ${{ !cancelled() }}
        run: nix run 'github:Mic92/nix-fast-build/807539facae08bede14d1ad258b4003721252e79' -- --no-nom --skip-cached --retries 2 --flake '.#checks.x86_64-linux.pre-commit-check'
